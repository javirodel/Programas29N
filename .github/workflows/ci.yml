name: CI Calidad y Compilación 29N

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato Prettier
        run: npm run format:check

      - name: Ejecutar ESLint y reglas jsx-a11y
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Compilar y validar corpus N0-N4
        run: npm run data:build

      - name: Ejecutar suite de tests
        run: npm test

      - name: Compilar aplicación Next.js
        run: npm run build
